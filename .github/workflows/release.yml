name: Release (packages)

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux-deb:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master pin
        with:
          toolchain: stable
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build release binary and .deb
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          cargo build --release --locked
          bash packaging/linux/build-deb.sh "${VERSION}" amd64 target/release/hecate-lampad-proxmox dist
      - name: Upload assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            dist/*.deb
          fail_on_unmatched_files: true
